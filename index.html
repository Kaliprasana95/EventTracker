<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Tracker - Real-time Urgency</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f35 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ════════════════════════════════════════════════════ HEADER */
        .header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .sync-status {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sync-status.connected {
            color: var(--success);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-small {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        /* ════════════════════════════════════════════════════ NAV TABS */
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
            overflow-x: auto;
            padding: 0 1.5rem;
        }

        .nav-tab {
            padding: 1rem 1.5rem;
            border: none;
            background: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            white-space: nowrap;
        }

        .nav-tab:hover {
            color: var(--accent);
        }

        .nav-tab.active {
            color: var(--accent);
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 3px 3px 0 0;
        }

        /* ════════════════════════════════════════════════════ CONTENT */
        .content {
            flex: 1;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ════════════════════════════════════════════════════ EVENT CARDS */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-card {
            border-radius: 0.75rem;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid;
            position: relative;
            overflow: hidden;
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.05;
            pointer-events: none;
        }

        .event-card:hover {
            transform: translateX(4px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
            cursor: pointer;
        }

        .event-card:active {
            transform: translateX(2px);
        }

        .event-card.completed {
            opacity: 0.6;
        }

        .event-content {
            flex: 1;
            min-width: 0;
        }

        .event-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .event-card.completed .event-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .event-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }

        .event-time {
            font-weight: 700;
            color: var(--text-primary);
        }

        .event-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .event-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 0.4rem;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .event-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .event-btn.done {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .event-btn.priority {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }

        /* ════════════════════════════════════════════════════ EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* ════════════════════════════════════════════════════ CALENDAR */
        .calendar-container {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 100%;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .calendar-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .calendar-nav {
            display: flex;
            gap: 1rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.3rem;
        }

        .calendar-day-header {
            text-align: center;
            font-weight: 600;
            padding: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .calendar-date {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            border-radius: 0.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            min-height: 70px;
            padding: 0.4rem;
            font-size: 0.75rem;
        }

        .calendar-date:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .calendar-date.other-month {
            color: var(--text-secondary);
            opacity: 0.5;
            pointer-events: none;
        }

        .calendar-date.today {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.15);
        }

        .calendar-date-number {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            min-height: 16px;
        }

        .calendar-date-events {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            overflow-y: auto;
        }

        .calendar-event-item {
            padding: 0.3rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.65rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .calendar-event-item:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* ════════════════════════════════════════════════════ MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--secondary);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* ════════════════════════════════════════════════════ CONFIRMATION */
        .confirmation-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1001;
            align-items: center;
            justify-content: center;
        }

        .confirmation-modal.active {
            display: flex;
        }

        .confirmation-content {
            background: var(--secondary);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            text-align: center;
        }

        .confirmation-content h3 {
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }

        .confirmation-content p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .confirmation-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--primary);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        /* ════════════════════════════════════════════════════ SETTINGS */
        .settings-panel {
            background: var(--secondary);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 500px;
        }

        .color-palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .palette-option {
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .palette-option:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .palette-option.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }

        .palette-preview {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
            border-radius: 0.3rem;
            overflow: hidden;
            height: 40px;
        }

        .palette-preview-color {
            flex: 1;
        }

        .palette-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ════════════════════════════════════════════════════ RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .header-controls {
                width: 100%;
                gap: 0.5rem;
            }

            .sync-status {
                font-size: 0.75rem;
            }

            .event-card {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem;
                gap: 1rem;
            }

            .event-content {
                width: 100%;
            }

            .event-title {
                font-size: 1rem;
            }

            .event-meta {
                font-size: 0.85rem;
                gap: 1rem;
            }

            .event-actions {
                width: 100%;
                justify-content: space-between;
                gap: 0.5rem;
            }

            .event-btn {
                padding: 0.5rem;
                font-size: 0.8rem;
                flex: 1;
            }

            .calendar-grid {
                gap: 0.2rem;
            }

            .calendar-date {
                min-height: 60px;
                font-size: 0.7rem;
                padding: 0.3rem;
            }

            .calendar-date-number {
                font-size: 0.9rem;
                margin-bottom: 0.2rem;
            }

            .calendar-date-events {
                gap: 0.15rem;
            }

            .calendar-event-item {
                font-size: 0.6rem;
                padding: 0.2rem 0.3rem;
            }

            .content {
                padding: 0.75rem;
            }

            .nav-tabs {
                padding: 0 0.75rem;
                overflow-x: auto;
            }

            .nav-tab {
                padding: 0.6rem 0.75rem;
                font-size: 0.9rem;
            }

            .modal-content {
                padding: 1.5rem;
                max-width: 95%;
            }

            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }

            .btn-small {
                padding: 0.4rem 0.7rem;
                font-size: 0.75rem;
            }

            .modal-actions {
                flex-direction: column-reverse;
            }

            .modal-actions button {
                width: 100%;
            }

            .confirmation-actions button {
                flex: 1;
            }

            .settings-panel {
                max-width: 100%;
            }

            .color-palette-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }

            .palette-option {
                padding: 0.75rem;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                font-size: 16px;
            }

            h1, h2, h3 {
                word-break: break-word;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.2rem;
            }

            .header-controls {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }

            .nav-tab {
                padding: 0.5rem 0.5rem;
                font-size: 0.8rem;
            }

            .event-card {
                padding: 0.75rem;
            }

            .event-btn {
                padding: 0.4rem 0.3rem;
                font-size: 0.7rem;
            }

            .modal-content {
                padding: 1.25rem;
            }

            .calendar-date {
                min-height: 50px;
                font-size: 0.65rem;
            }

            .color-palette-grid {
                grid-template-columns: 1fr;
            }

            .confirmation-content {
                padding: 1.5rem;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <h1>📅 Event Tracker</h1>
            <div class="header-controls">
                <div class="sync-status" id="syncStatus">
                    <span id="syncDot">●</span>
                    <span id="syncText">Not signed in</span>
                </div>
                <button class="btn btn-primary" id="signInBtn" onclick="app.signIn()">Sign in with Google</button>
                <button class="btn btn-secondary" id="signOutBtn" onclick="app.signOut()" style="display:none;">Sign Out</button>
                <button class="btn btn-secondary" onclick="openSettings()">⚙️ Settings</button>
            </div>
        </div>

        <!-- NAV TABS -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="priority" onclick="switchPage('priority')">⭐ Priority</button>
            <button class="nav-tab" data-page="non-priority" onclick="switchPage('non-priority')">📋 Non-Priority</button>
            <button class="nav-tab" data-page="all" onclick="switchPage('all')">🎯 All Events</button>
            <button class="nav-tab" data-page="completed" onclick="switchPage('completed')">✓ Done</button>
            <button class="nav-tab" data-page="calendar" onclick="switchPage('calendar')">📆 Calendar</button>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <!-- PRIORITY PAGE -->
            <div class="page active" id="priority-page" data-page="priority">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <h2>Priority Events</h2>
                    <button class="btn btn-primary" onclick="openAddEventModal()">+ Add Event</button>
                </div>
                <div class="events-list" id="priority-list"></div>
            </div>

            <!-- NON-PRIORITY PAGE -->
            <div class="page" id="non-priority-page" data-page="non-priority">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <h2>Non-Priority Events</h2>
                    <button class="btn btn-primary" onclick="openAddEventModal()">+ Add Event</button>
                </div>
                <div class="events-list" id="non-priority-list"></div>
            </div>

            <!-- ALL PAGE -->
            <div class="page" id="all-page" data-page="all">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <h2>All Events</h2>
                    <button class="btn btn-primary" onclick="openAddEventModal()">+ Add Event</button>
                </div>
                <div class="events-list" id="all-list"></div>
            </div>

            <!-- COMPLETED PAGE -->
            <div class="page" id="completed-page" data-page="completed">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <h2>Completed Events ✓</h2>
                    <button class="btn btn-secondary" onclick="app.clearCompleted()" style="color:#10b981;">Clear All</button>
                </div>
                <div class="events-list" id="completed-list"></div>
            </div>

            <!-- CALENDAR PAGE -->
            <div class="page" id="calendar-page" data-page="calendar">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <h2>Calendar View</h2>
                    <button class="btn btn-primary" onclick="openAddEventModal()">+ Add Event</button>
                </div>
                <div class="calendar-container" id="calendar-container"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: Add/Edit Event -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Event</h2>
                <button class="modal-close" onclick="closeEventModal()">×</button>
            </div>
            <form onsubmit="saveEvent(event)">
                <div class="form-group">
                    <label>Event Title</label>
                    <input type="text" id="eventTitle" required placeholder="e.g., Submit Report">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="time" id="eventTime" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="eventPriority">
                    <label for="eventPriority" style="margin:0;">Mark as Priority</label>
                </div>
                <div class="form-group">
                    <label>Notes (Optional)</label>
                    <textarea id="eventNotes" placeholder="Add notes, links, or details... (e.g., https://example.com)" style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:0.5rem; background:var(--primary); color:var(--text-primary); font-size:0.9rem; min-height:80px; font-family:inherit; resize:vertical;"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEventModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Settings -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close" onclick="closeSettings()">×</button>
            </div>
            <div class="form-group">
                <label>Color Scheme</label>
                <div class="color-palette-grid" id="paletteGrid"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-primary" onclick="closeSettings()">Done</button>
            </div>
        </div>
    </div>

    <!-- CONFIRMATION MODAL -->
    <div class="confirmation-modal" id="confirmationModal">
        <div class="confirmation-content">
            <h3 id="confirmTitle">Confirm Action</h3>
            <p id="confirmMessage">Are you sure?</p>
            <div class="confirmation-actions">
                <button class="btn btn-secondary" onclick="cancelConfirmation()">Cancel</button>
                <button class="btn btn-primary" id="confirmBtn" onclick="executeConfirmation()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- DATE EVENTS MODAL -->
    <div class="modal" id="dateEventsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="dateEventsTitle">Events for Date</h2>
                <button class="modal-close" onclick="closeDateEventsModal()">×</button>
            </div>
            <div id="dateEventsList" style="max-height: 400px; overflow-y: auto; margin-bottom: 1.5rem;"></div>
            <div style="display:flex; gap:1rem;">
                <button class="btn btn-primary" onclick="openAddEventModalForDate()" style="flex:1;">+ Add Event</button>
                <button class="btn btn-secondary" onclick="closeDateEventsModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- EVENT DETAILS MODAL -->
    <div class="modal" id="eventDetailsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="detailsTitle">Event Details</h2>
                <button class="modal-close" onclick="closeEventDetailsModal()">×</button>
            </div>
            <div style="margin-bottom:1.5rem;">
                <div style="padding:1.5rem; background:var(--primary); border-radius:0.5rem; border-left:4px solid;" id="detailsContent"></div>
            </div>
            <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="editEventFromDetails()">✏️ Edit</button>
                <button class="btn btn-primary" id="completeBtn" onclick="completeEventFromDetails()">✓ Mark Done</button>
                <button class="btn btn-secondary" onclick="deleteEventFromDetails()">🗑️ Delete</button>
                <button class="btn btn-secondary" onclick="closeEventDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '381628681298-v8rvvd8l9ao64fba2gutn9gb70fqicsl.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';
        const FILENAME = 'event_tracker_data.json';

        let pendingConfirmation = null;
        let saveTimeout = null;

        let app = {
            events: [],
            settings: {
                colorScheme: 'classic',
                theme: 'dark'
            },
            token: null,
            fileId: null,
            currentEditingId: null,
            renderScheduled: false,
            currentMonth: null,

            // ── INIT ──
            async init() {
                this.loadLocalData();
                this.renderAll();
                this.startAutoUpdate();
                this.initGoogleAuth();
            },

            // ── GOOGLE AUTH ──
            initGoogleAuth() {
                google.accounts.id.initialize({ client_id: CLIENT_ID });
            },

            async signIn() {
                try {
                    const response = await new Promise((resolve, reject) => {
                        const tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: CLIENT_ID,
                            scope: SCOPES,
                            callback: resolve,
                        });
                        tokenClient.requestAccessToken();
                    });
                    this.token = response.access_token;
                    await this.loadFromDrive();
                    this.updateSyncStatus(true);
                    document.getElementById('signInBtn').style.display = 'none';
                    document.getElementById('signOutBtn').style.display = 'flex';
                } catch (err) {
                    console.error('Sign in failed:', err);
                    this.updateSyncStatus(false);
                }
            },

            async signOut() {
                this.token = null;
                this.fileId = null;
                this.updateSyncStatus(false);
                document.getElementById('signInBtn').style.display = 'flex';
                document.getElementById('signOutBtn').style.display = 'none';
            },

            updateSyncStatus(connected) {
                const status = document.getElementById('syncStatus');
                const dot = document.getElementById('syncDot');
                const text = document.getElementById('syncText');
                if (connected) {
                    dot.style.color = '#10b981';
                    text.textContent = 'Synced with Drive';
                    status.classList.add('connected');
                } else {
                    dot.style.color = '#94a3b8';
                    text.textContent = 'Not signed in';
                    status.classList.remove('connected');
                }
            },

            // ── DRIVE SYNC ──
            async loadFromDrive() {
                try {
                    if (!this.fileId) await this.findOrCreateFile();
                    const response = await fetch(`https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`, {
                        headers: { 'Authorization': `Bearer ${this.token}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        this.events = data.events || [];
                        this.settings = data.settings || this.settings;
                        this.renderAll();
                    }
                } catch (err) {
                    console.error('Failed to load from Drive:', err);
                }
            },

            async saveToDrive() {
                if (!this.token) return;
                try {
                    if (!this.fileId) await this.findOrCreateFile();
                    const data = { events: this.events, settings: this.settings };
                    const metadata = { name: FILENAME, mimeType: 'application/json' };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', new Blob([JSON.stringify(data)], { type: 'application/json' }));
                    await fetch(`https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=multipart`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `Bearer ${this.token}` },
                        body: form
                    });
                } catch (err) {
                    console.error('Failed to save to Drive:', err);
                }
            },

            async findOrCreateFile() {
                try {
                    const response = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FILENAME}' and trashed=false&spaces=drive&pageSize=1`, {
                        headers: { 'Authorization': `Bearer ${this.token}` }
                    });
                    const data = await response.json();
                    if (data.files && data.files.length > 0) {
                        this.fileId = data.files[0].id;
                    } else {
                        await this.createFile();
                    }
                } catch (err) {
                    console.error('Failed to find file:', err);
                }
            },

            async createFile() {
                try {
                    const metadata = { name: FILENAME, mimeType: 'application/json' };
                    const file = new Blob([JSON.stringify({ events: [], settings: this.settings })], { type: 'application/json' });
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', file);
                    const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${this.token}` },
                        body: form
                    });
                    const data = await response.json();
                    this.fileId = data.id;
                } catch (err) {
                    console.error('Failed to create file:', err);
                }
            },

            // ── LOCAL STORAGE ──
            loadLocalData() {
                const saved = localStorage.getItem('eventTrackerData');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.events = data.events || [];
                    this.settings = data.settings || this.settings;
                }
            },

            saveLocal() {
                localStorage.setItem('eventTrackerData', JSON.stringify({ events: this.events, settings: this.settings }));
            },

            // ── EVENTS ──
            addEvent(title, date, time, priority, notes = '') {
                const event = {
                    id: Date.now().toString(),
                    title,
                    date,
                    time,
                    priority,
                    notes: notes || '',
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                this.events.push(event);
                this.save();
                return event;
            },

            updateEvent(id, title, date, time, priority, notes = '') {
                const event = this.events.find(e => e.id === id);
                if (event) {
                    event.title = title;
                    event.date = date;
                    event.time = time;
                    event.priority = priority;
                    event.notes = notes || '';
                    this.save();
                }
            },

            deleteEvent(id) {
                const event = this.events.find(e => e.id === id);
                if (!event) return;
                showConfirmation(
                    `Delete "${event.title}"?`,
                    'This action cannot be undone.',
                    () => {
                        app.events = app.events.filter(e => e.id !== id);
                        app.save();
                    }
                );
            },

            toggleComplete(id) {
                const event = this.events.find(e => e.id === id);
                if (event) {
                    event.completed = !event.completed;
                    this.save();
                }
            },

            togglePriority(id) {
                const event = this.events.find(e => e.id === id);
                if (!event) return;
                const action = event.priority ? 'Remove from priority?' : 'Mark as priority?';
                showConfirmation(
                    action,
                    `"${event.title}"`,
                    () => {
                        event.priority = !event.priority;
                        app.save();
                    }
                );
            },

            clearCompleted() {
                const completedCount = this.events.filter(e => e.completed).length;
                if (completedCount === 0) return;
                showConfirmation(
                    `Clear ${completedCount} completed event${completedCount > 1 ? 's' : ''}?`,
                    'This action cannot be undone.',
                    () => {
                        app.events = app.events.filter(e => !e.completed);
                        app.save();
                    }
                );
            },

            save() {
                this.saveLocal();
                // Debounce Drive save - only save once every 2 seconds
                if (saveTimeout) clearTimeout(saveTimeout);
                if (this.token) {
                    saveTimeout = setTimeout(() => this.saveToDrive(), 2000);
                }
            },

            // ── RENDERING ──
            renderAll() {
                if (this.renderScheduled) return; // Skip if already scheduled
                this.renderScheduled = true;
                requestAnimationFrame(() => {
                    this.renderEventList('priority');
                    this.renderEventList('non-priority');
                    this.renderEventList('all');
                    this.renderCalendar();
                    this.renderScheduled = false;
                });
            },

            renderEventList(type) {
                let events = this.events;
                if (type === 'priority') events = events.filter(e => e.priority && !e.completed);
                else if (type === 'non-priority') events = events.filter(e => !e.priority && !e.completed);
                else if (type === 'all') events = events.filter(e => !e.completed);
                else if (type === 'completed') events = events.filter(e => e.completed);

                events.sort((a, b) => {
                    const timeA = new Date(`${a.date}T${a.time}`);
                    const timeB = new Date(`${b.date}T${b.time}`);
                    return timeB - timeA; // Reverse for completed (newest first)
                });

                const listId = `${type}-list`;
                const list = document.getElementById(listId);
                if (!list) return;

                if (events.length === 0) {
                    list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><p>${type === 'completed' ? 'No completed events yet' : 'No events yet'}</p></div>`;
                    return;
                }

                list.innerHTML = events.map(event => this.createEventCardHTML(event, type === 'completed')).join('');
            },

            createEventCardHTML(event, isCompleted = false) {
                const eventTime = new Date(`${event.date}T${event.time}`);
                const now = new Date();
                const diff = eventTime - now;
                const color = this.getUrgencyColor(diff);
                const timeStr = this.formatTimeRemaining(diff);

                return `
                    <div class="event-card" style="background:${color}40; border-color:${color}; ${isCompleted ? 'opacity:0.7;' : ''}" onclick="openEventDetailsModal('${event.id}')">
                        <div class="event-content">
                            <div class="event-title">${event.title}</div>
                            <div class="event-meta">
                                <span>${event.date}</span>
                                <span class="event-time">⏱️ ${timeStr}</span>
                                ${event.priority ? '<span>⭐ Priority</span>' : ''}
                                ${event.notes ? '<span>📝 Notes</span>' : ''}
                            </div>
                        </div>
                        <div class="event-actions" onclick="event.stopPropagation();">
                            ${isCompleted ? `<button class="event-btn done" onclick="app.toggleComplete('${event.id}'); app.renderAll();" style="flex:1; background:#10b98120; color:#10b981;">↩️ Undo</button>` : `
                                <button class="event-btn" onclick="app.togglePriority('${event.id}')">⭐</button>
                                <button class="event-btn done" onclick="app.toggleComplete('${event.id}')">✓</button>
                                <button class="event-btn" onclick="openEditEventModal('${event.id}')">✏️</button>
                                <button class="event-btn" onclick="app.deleteEvent('${event.id}')">🗑️</button>
                            `}
                        </div>
                    </div>
                `;
            },

            getUrgencyColor(diff) {
                const hours = diff / (1000 * 60 * 60);
                const days = hours / 24;

                if (days <= 3) {
                    const intensity = Math.max(0, Math.min(1, days / 3));
                    return this.interpolateColor(
                        this.getColorScheme().critical,
                        this.getColorScheme().urgent,
                        intensity
                    );
                } else if (days <= 7) {
                    const intensity = (days - 3) / 4;
                    return this.interpolateColor(
                        this.getColorScheme().urgent,
                        this.getColorScheme().medium,
                        intensity
                    );
                } else if (days <= 30) {
                    const intensity = (days - 7) / 23;
                    return this.interpolateColor(
                        this.getColorScheme().medium,
                        this.getColorScheme().upcoming,
                        intensity
                    );
                } else {
                    const intensity = Math.min(1, (days - 30) / 30);
                    return this.interpolateColor(
                        this.getColorScheme().upcoming,
                        this.getColorScheme().future,
                        intensity
                    );
                }
            },

            getColorScheme() {
                const schemes = {
                    classic: {
                        critical: '#FF4444',
                        urgent: '#FFA500',
                        medium: '#FFD700',
                        upcoming: '#4169E1',
                        future: '#32CD32'
                    },
                    sunset: {
                        critical: '#D32F2F',
                        urgent: '#FF6B6B',
                        medium: '#FFAB91',
                        upcoming: '#64B5F6',
                        future: '#81C784'
                    },
                    professional: {
                        critical: '#8B0000',
                        urgent: '#CD5C5C',
                        medium: '#D2B48C',
                        upcoming: '#4682B4',
                        future: '#9DC183'
                    },
                    neon: {
                        critical: '#FF1493',
                        urgent: '#FF8C00',
                        medium: '#FFD700',
                        upcoming: '#00FFFF',
                        future: '#00FF00'
                    },
                    pastel: {
                        critical: '#FF9999',
                        urgent: '#FFCC99',
                        medium: '#FFFF99',
                        upcoming: '#99CCFF',
                        future: '#99FF99'
                    }
                };
                return schemes[this.settings.colorScheme] || schemes.classic;
            },

            interpolateColor(color1, color2, ratio) {
                const c1 = this.hexToRgb(color1);
                const c2 = this.hexToRgb(color2);
                const r = Math.round(c1.r + (c2.r - c1.r) * ratio);
                const g = Math.round(c1.g + (c2.g - c1.g) * ratio);
                const b = Math.round(c1.b + (c2.b - c1.b) * ratio);
                return `rgb(${r},${g},${b})`;
            },

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 0, g: 0, b: 0 };
            },

            formatTimeRemaining(diff) {
                if (diff < 0) return '⏰ Overdue';
                const totalSeconds = Math.floor(diff / 1000);
                const totalMinutes = Math.floor(totalSeconds / 60);
                const totalHours = Math.floor(totalMinutes / 60);
                const days = Math.floor(totalHours / 24);

                if (days > 0) {
                    const remainingHours = totalHours % 24;
                    return `${days}d ${remainingHours}h`;
                } else if (totalHours > 0) {
                    const remainingMinutes = totalMinutes % 60;
                    return `${totalHours}h ${remainingMinutes}m`;
                } else {
                    return `${totalMinutes}m`;
                }
            },

            renderCalendar() {
                const displayMonth = this.currentMonth || new Date();
                const year = displayMonth.getFullYear();
                const month = displayMonth.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay();
                const today = new Date();

                let html = `
                    <div class="calendar-header">
                        <h2>${firstDay.toLocaleString('default', { month: 'long', year: 'numeric' })}</h2>
                        <div class="calendar-nav">
                            <button class="btn btn-secondary btn-small" onclick="app.prevMonth()">← Prev</button>
                            <button class="btn btn-secondary btn-small" onclick="app.nextMonth()">Next →</button>
                        </div>
                    </div>
                    <div class="calendar-grid">
                `;

                const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                dayNames.forEach(day => {
                    html += `<div class="calendar-day-header">${day}</div>`;
                });

                for (let i = 0; i < startingDayOfWeek; i++) {
                    html += '<div class="calendar-date other-month"></div>';
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const dayEvents = this.events.filter(e => e.date === dateStr && !e.completed);
                    const isToday = dateStr === today.toISOString().split('T')[0];

                    html += `<div class="calendar-date ${isToday ? 'today' : ''}" onclick="openDateEventsModal('${dateStr}')">
                        <div class="calendar-date-number">${day}</div>
                        <div class="calendar-date-events">
                            ${dayEvents.slice(0, 3).map(e => {
                                const eventTime = new Date(`${e.date}T${e.time}`);
                                const color = this.getUrgencyColor(eventTime - new Date());
                                return `<div class="calendar-event-item" style="background:${color}80; border-left:3px solid ${color};">
                                    <span style="display:inline-block; width:6px; height:6px; background:${color}; border-radius:50%; margin-right:3px;"></span>${e.title.substring(0, 14)}
                                </div>`;
                            }).join('')}
                            ${dayEvents.length > 3 ? `<div style="color:#cbd5e1; font-size:0.6rem; padding:0.2rem;">+${dayEvents.length - 3} more</div>` : ''}
                        </div>
                    </div>`;
                }

                html += '</div>';
                document.getElementById('calendar-container').innerHTML = html;
            },

            prevMonth() {
                if (!this.currentMonth) {
                    this.currentMonth = new Date();
                }
                this.currentMonth.setMonth(this.currentMonth.getMonth() - 1);
                this.renderCalendar();
            },

            nextMonth() {
                if (!this.currentMonth) {
                    this.currentMonth = new Date();
                }
                this.currentMonth.setMonth(this.currentMonth.getMonth() + 1);
                this.renderCalendar();
            },

            startAutoUpdate() {
                setInterval(() => this.renderAll(), 60000); // Update every minute
            }
        };

        // ── UI FUNCTIONS ──
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`${page}-page`).classList.add('active');
            document.querySelector(`[data-page="${page}"]`).classList.add('active');
        }

        function openAddEventModal() {
            app.currentEditingId = null;
            document.getElementById('modalTitle').textContent = 'Add Event';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('eventTime').value = '09:00';
            document.getElementById('eventPriority').checked = false;
            document.getElementById('eventModal').classList.add('active');
        }

        function openEditEventModal(id) {
            const event = app.events.find(e => e.id === id);
            if (!event) return;
            app.currentEditingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Event';
            document.getElementById('eventTitle').value = event.title;
            document.getElementById('eventDate').value = event.date;
            document.getElementById('eventTime').value = event.time;
            document.getElementById('eventPriority').checked = event.priority;
            document.getElementById('eventNotes').value = event.notes || '';
            document.getElementById('eventModal').classList.add('active');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        function saveEvent(e) {
            e.preventDefault();
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const priority = document.getElementById('eventPriority').checked;
            const notes = document.getElementById('eventNotes').value;

            if (app.currentEditingId) {
                app.updateEvent(app.currentEditingId, title, date, time, priority, notes);
            } else {
                app.addEvent(title, date, time, priority, notes);
            }
            closeEventModal();
        }

        function openSettings() {
            renderPaletteOptions();
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function renderPaletteOptions() {
            const schemes = ['classic', 'sunset', 'professional', 'neon', 'pastel'];
            const colors = {
                classic: ['#FF4444', '#FFA500', '#FFD700', '#4169E1', '#32CD32'],
                sunset: ['#D32F2F', '#FF6B6B', '#FFAB91', '#64B5F6', '#81C784'],
                professional: ['#8B0000', '#CD5C5C', '#D2B48C', '#4682B4', '#9DC183'],
                neon: ['#FF1493', '#FF8C00', '#FFD700', '#00FFFF', '#00FF00'],
                pastel: ['#FF9999', '#FFCC99', '#FFFF99', '#99CCFF', '#99FF99']
            };

            const grid = document.getElementById('paletteGrid');
            grid.innerHTML = schemes.map(scheme => `
                <div class="palette-option ${app.settings.colorScheme === scheme ? 'active' : ''}" onclick="selectPalette('${scheme}')">
                    <div class="palette-preview">
                        ${colors[scheme].map(c => `<div class="palette-preview-color" style="background:${c}"></div>`).join('')}
                    </div>
                    <div class="palette-name">${scheme.charAt(0).toUpperCase() + scheme.slice(1)}</div>
                </div>
            `).join('');
        }

        function selectPalette(scheme) {
            app.settings.colorScheme = scheme;
            app.save();
            renderPaletteOptions();
            app.renderAll();
        }

        // ── CONFIRMATION ──
        function showConfirmation(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            pendingConfirmation = onConfirm;
            document.getElementById('confirmationModal').classList.add('active');
        }

        function cancelConfirmation() {
            pendingConfirmation = null;
            document.getElementById('confirmationModal').classList.remove('active');
        }

        function executeConfirmation() {
            if (pendingConfirmation) {
                pendingConfirmation();
                app.renderAll();
            }
            cancelConfirmation();
        }

        // ── DATE EVENTS MODAL ──
        let selectedDateForModal = null;
        let selectedEventForDetails = null;

        // Parse notes and convert URLs to clickable links
        function parseNotesWithLinks(text) {
            if (!text) return '';
            
            // Regex to match URLs
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, '<a href="$1" target="_blank" style="color:#3b82f6; text-decoration:underline; font-weight:500;">$1</a>')
                      .replace(/\n/g, '<br>');
        }

        function openDateEventsModal(dateStr) {
            selectedDateForModal = dateStr;
            const date = new Date(dateStr);
            const dateFormatted = date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            document.getElementById('dateEventsTitle').textContent = `Events for ${dateFormatted}`;
            
            const dayEvents = app.events.filter(e => e.date === dateStr && !e.completed)
                .sort((a, b) => {
                    const timeA = new Date(`${a.date}T${a.time}`);
                    const timeB = new Date(`${b.date}T${b.time}`);
                    return timeA - timeB;
                });
            
            let eventsHtml = '';
            if (dayEvents.length === 0) {
                eventsHtml = '<div style="color:#cbd5e1; padding:1rem; text-align:center;">No events for this date</div>';
            } else {
                eventsHtml = dayEvents.map(event => {
                    const eventTime = new Date(`${event.date}T${event.time}`);
                    const color = app.getUrgencyColor(eventTime - new Date());
                    const timeRemaining = app.formatTimeRemaining(eventTime - new Date());
                    
                    return `
                        <div style="background:#1e293b; border:1px solid #334155; border-left:4px solid ${color}; padding:1rem; border-radius:0.5rem; margin-bottom:0.75rem; cursor:pointer; transition:all 0.2s ease;" 
                             onmouseover="this.style.background='#1f2937'" 
                             onmouseout="this.style.background='#1e293b'"
                             onclick="openEventDetailsModal('${event.id}')">
                            <div style="display:flex; justify-content:space-between; align-items:start; gap:1rem;">
                                <div style="flex:1;">
                                    <div style="font-weight:600; color:#f1f5f9; margin-bottom:0.5rem;">${event.title}</div>
                                    <div style="font-size:0.9rem; color:#cbd5e1; margin-bottom:0.5rem;">
                                        🕐 ${event.time} | ⏱️ ${timeRemaining}
                                    </div>
                                    ${event.priority ? '<div style="display:inline-block; background:#fb923c20; color:#fb923c; padding:0.25rem 0.75rem; border-radius:0.3rem; font-size:0.8rem;">⭐ Priority</div>' : ''}
                                    ${event.notes ? '<div style="font-size:0.8rem; color:#cbd5e1; margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid #334155;">📝 Click to see notes</div>' : ''}
                                </div>
                                <div style="display:flex; gap:0.5rem;" onclick="event.stopPropagation();">
                                    <button class="event-btn" onclick="openEditEventModal('${event.id}'); closeDateEventsModal();">✏️</button>
                                    <button class="event-btn done" onclick="app.toggleComplete('${event.id}'); openDateEventsModal('${dateStr}');">✓</button>
                                    <button class="event-btn" onclick="app.deleteEvent('${event.id}'); openDateEventsModal('${dateStr}');">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            document.getElementById('dateEventsList').innerHTML = eventsHtml;
            document.getElementById('dateEventsModal').classList.add('active');
        }

        function closeDateEventsModal() {
            document.getElementById('dateEventsModal').classList.remove('active');
            selectedDateForModal = null;
        }

        function openAddEventModalForDate() {
            if (!selectedDateForModal) return;
            
            app.currentEditingId = null;
            document.getElementById('modalTitle').textContent = 'Add Event';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = selectedDateForModal;
            document.getElementById('eventTime').value = '09:00';
            document.getElementById('eventPriority').checked = false;
            document.getElementById('eventNotes').value = '';
            
            closeDateEventsModal();
            document.getElementById('eventModal').classList.add('active');
        }

        // ── EVENT DETAILS MODAL ──
        function openEventDetailsModal(eventId) {
            selectedEventForDetails = eventId;
            const event = app.events.find(e => e.id === eventId);
            if (!event) return;

            document.getElementById('detailsTitle').textContent = event.title;
            
            const eventTime = new Date(`${event.date}T${event.time}`);
            const timeRemaining = app.formatTimeRemaining(eventTime - new Date());
            const color = app.getUrgencyColor(eventTime - new Date());

            let detailsHtml = `
                <div style="margin-bottom:1rem;">
                    <div style="font-size:0.9rem; color:#cbd5e1; margin-bottom:0.75rem;">
                        <div>📅 ${event.date} | 🕐 ${event.time}</div>
                        <div style="margin-top:0.5rem;">⏱️ <strong>${timeRemaining}</strong></div>
                    </div>
                </div>
            `;

            if (event.priority) {
                detailsHtml += `<div style="background:#fb923c20; color:#fb923c; padding:0.5rem 0.75rem; border-radius:0.3rem; margin-bottom:1rem; display:inline-block;">⭐ Priority Event</div>`;
            }

            if (event.notes) {
                detailsHtml += `
                    <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid #334155;">
                        <h4 style="color:#f1f5f9; margin-bottom:0.75rem;">📝 Notes:</h4>
                        <div style="background:rgba(0,0,0,0.2); padding:1rem; border-radius:0.5rem; color:#cbd5e1; line-height:1.6;">
                            ${parseNotesWithLinks(event.notes)}
                        </div>
                    </div>
                `;
            }

            const detailsDiv = document.getElementById('detailsContent');
            detailsDiv.innerHTML = detailsHtml;
            detailsDiv.style.borderColor = color;

            document.getElementById('eventDetailsModal').classList.add('active');
        }

        function closeEventDetailsModal() {
            document.getElementById('eventDetailsModal').classList.remove('active');
            selectedEventForDetails = null;
        }

        function editEventFromDetails() {
            if (!selectedEventForDetails) return;
            closeEventDetailsModal();
            openEditEventModal(selectedEventForDetails);
        }

        function completeEventFromDetails() {
            if (!selectedEventForDetails) return;
            app.toggleComplete(selectedEventForDetails);
            closeEventDetailsModal();
            app.renderAll();
        }

        function deleteEventFromDetails() {
            if (!selectedEventForDetails) return;
            app.deleteEvent(selectedEventForDetails);
            closeEventDetailsModal();
            app.renderAll();
        }

        // ── INIT ──
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
